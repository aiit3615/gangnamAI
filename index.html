<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1000프로의 새로운 시선</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #d9eef3;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .visual-card {
      width: min(92vw, 700px);
      aspect-ratio: 1 / 1;
      background: #c6e7ee;
      overflow: hidden;
      position: relative;
      border-radius: 0;
      box-shadow: 0 18px 50px rgba(30, 65, 80, 0.15);
    }

    .visual-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
        background: #c6e7ee;
      }

      .visual-card {
        width: 100vw;
        height: 100vw;
        box-shadow: none;
      }
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }
      .visual-card {
        width: 180mm;
        height: 180mm;
        box-shadow: none;
      }
    }
  </style>
</head>
